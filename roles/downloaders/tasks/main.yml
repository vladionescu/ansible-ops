---

- name: Create downloads group
  group:
    name: downloads
    state: present
  tags: [arr_storage, media_migrate]

- name: Create sabnzb user
  user:
    name: sabnzb
    group: downloads
    create_home: false
    shell: /usr/bin/false
    state: present
  register: sabnzb_user
  tags: [media_migrate]

- name: Create sonarr user
  user:
    name: sonarr
    group: downloads
    create_home: false
    shell: /usr/bin/false
    state: present
  register: sonarr_user
  tags: [arr_storage, media_migrate]

- name: Create radarr user
  user:
    name: radarr
    group: downloads
    create_home: false
    shell: /usr/bin/false
    state: present
  register: radarr_user
  tags: [arr_storage, media_migrate]

- name: Create readarr user
  user:
    name: readarr
    group: downloads
    create_home: false
    shell: /usr/bin/false
    state: present
  register: readarr_user
  tags: [media_migrate]

- name: Create downloaders Docker network
  docker_network:
    name: "{{ downloaders.docker_network }}"
    enable_ipv6: false

- name: Prepare sabnzbd configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: sabnzbd
  when: media_config_root != '/data/docker'
  tags: [media_migrate]

- name: Prepare unfinished downloads on SSD
  include_tasks: migrate_incomplete.yml
  when: media_incomplete_root != '/data/downloads'
  tags: [media_migrate]

- name: Sabnzbd container
  docker_container:
    name: sabnzbd
    image: linuxserver/sabnzbd
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes: "{{ [media_config_root ~ '/sabnzbd/config:/config', '/data/downloads:/data/downloads'] + ([media_incomplete_root ~ ':' ~ media_incomplete_root] if media_incomplete_root != '/data/downloads' else []) }}"
    env:
      PUID: "{{ sabnzb_user.uid }}"
      PGID: "{{ sabnzb_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [media_migrate]

- name: Prepare sonarr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: sonarr
  when: media_config_root != '/data/docker'
  tags: [media_migrate, arr_storage]

- name: Sonarr container
  docker_container:
    name: sonarr
    image: linuxserver/sonarr
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes: "{{ [media_config_root ~ '/sonarr/config:/config', '/data:/data'] if downloaders_optimizations_enabled else [media_config_root ~ '/sonarr/config:/config', '/data/downloads:/data/downloads', '/data/anime-manual-import:/data/anime-manual-import', '/data/plex/shows:/data/plex/shows'] }}"
    env:
      PUID: "{{ sonarr_user.uid }}"
      PGID: "{{ sonarr_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
    security_opts:
      - "seccomp=unconfined"
  tags: [arr_storage, media_migrate]

- name: Prepare radarr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: radarr
  when: media_config_root != '/data/docker'
  tags: [media_migrate, arr_storage]

- name: Radarr container
  docker_container:
    name: radarr
    image: linuxserver/radarr
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes: "{{ [media_config_root ~ '/radarr/config:/config', '/data:/data'] if downloaders_optimizations_enabled else [media_config_root ~ '/radarr/config:/config', '/data/downloads:/data/downloads', '/data/plex/movies:/data/plex/movies'] }}"
    env:
      PUID: "{{ radarr_user.uid }}"
      PGID: "{{ radarr_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [arr_storage, media_migrate]

- name: Prepare bazarr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: bazarr
  when: media_config_root != '/data/docker'
  tags: [media_migrate]

- name: Bazarr container
  docker_container:
    name: bazarr
    image: lscr.io/linuxserver/bazarr
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes:
      - "{{ media_config_root }}/bazarr/config:/config"
      - /data/plex/shows:/data/plex/shows
      - /data/plex/movies:/data/plex/movies
    env:
      PUID: "{{ radarr_user.uid }}"
      PGID: "{{ radarr_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [media_migrate]

- name: Seerr config permissions
  file:
    path: "{{ media_config_root }}/seerr/config"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: yes
  tags: [media_migrate]

- name: Prepare seerr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: seerr
  when: media_config_root != '/data/docker'
  tags: [media_migrate]

- name: Seerr container
  docker_container:
    name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: yes
    restart_policy: unless-stopped
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes:
      - "{{ media_config_root }}/seerr/config:/app/config"
    env:
      TZ: "{{ timezone }}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 60s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [media_migrate]

- name: Prepare prowlarr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: prowlarr
  when: media_config_root != '/data/docker'
  tags: [media_migrate]

- name: Prowlarr container
  docker_container:
    name: prowlarr
    image: lscr.io/linuxserver/prowlarr
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes:
      - "{{ media_config_root }}/prowlarr/config:/config"
    env:
      PUID: "{{ radarr_user.uid }}"
      PGID: "{{ radarr_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [media_migrate]

- name: Prepare readarr configuration on SSD
  include_tasks: migrate_config.yml
  vars:
    media_service_name: readarr
  when: media_config_root != '/data/docker'
  tags: [media_migrate]

- name: Readarr container
  docker_container:
    name: readarr
    image: lscr.io/linuxserver/readarr:0.4.19-nightly
    pull: "{{ downloaders_pull_images }}"
    state: started
    volumes:
      - "{{ media_config_root }}/readarr/config:/config"
      - /data/downloads/books:/data/downloads/books
      - /data/books:/data/books
    env:
      PUID: "{{ readarr_user.uid }}"
      PGID: "{{ readarr_user.group }}"
      TZ: "{{ timezone }}"
    networks:
      - name: "{{ downloaders.docker_network }}"
  tags: [media_migrate]

- name: Unpackerr container
  docker_container:
    name: unpackerr
    image: golift/unpackerr
    pull: yes
    state: started
    user: "{{ sabnzb_user.uid }}:{{ sabnzb_user.group }}"
    volumes:
      - /data/downloads:/data/downloads
    env:
      TZ: "{{ timezone }}"
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: "{{ unpackerr.sonarr_api_key }}"
      UN_SONARR_0_PROTOCOLS: usenet
      UN_SONARR_0_DELETE_ORIG: "true"
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: "{{ unpackerr.radarr_api_key }}"
      UN_RADARR_0_PROTOCOLS: usenet
      UN_RADARR_0_DELETE_ORIG: "true"
      UN_READARR_0_URL: http://readarr:8787
      UN_READARR_0_API_KEY: "{{ unpackerr.readarr_api_key }}"
      UN_READARR_0_PROTOCOLS: usenet
      UN_READARR_0_DELETE_ORIG: "true"
    networks:
      - name: "{{ downloaders.docker_network }}"
  when: not downloaders_optimizations_enabled

- name: Create Sabnzbd dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sabnzb_user.uid }}"
    group: "{{ sabnzb_user.group }}"
    mode: 0775
  loop:
    - /data/downloads/complete-sab
    - /data/downloads/incomplete-sab
    - /data/downloads/nbz-files

- name: Create Sonarr dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sonarr_user.uid }}"
    group: "{{ sonarr_user.group }}"
    mode: 0775
  loop:
    - /data/downloads/tv
    - /data/plex/shows

- name: Create Radarr dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ radarr_user.uid }}"
    group: "{{ radarr_user.group }}"
    mode: 0775
  loop:
    - /data/downloads/movies
    - /data/plex/movies

- name: Create Readarr dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ readarr_user.uid }}"
    group: "{{ readarr_user.group }}"
    mode: 0775
  loop:
    - /data/downloads/books
    - /data/books

# Opt-in on klaxon only. SAB already extracts Usenet downloads.
- name: Disable redundant Usenet unpacker
  docker_container:
    name: unpackerr
    state: absent
  when: downloaders_optimizations_enabled
  tags: [arr_settings]

- name: Install media settings reconciler
  copy:
    src: reconcile_media.py
    dest: /usr/local/sbin/reconcile-media
    owner: root
    group: root
    mode: '0700'
  when: downloaders_optimizations_enabled
  tags: [arr_settings]

- name: Reconcile internal media connections and regular TV defaults
  command: /usr/local/sbin/reconcile-media
  environment:
    MEDIA_CONFIG_ROOT: "{{ media_config_root }}"
  register: media_settings_result
  changed_when: "'Changed:' in media_settings_result.stdout"
  when: downloaders_optimizations_enabled
  tags: [arr_settings]
